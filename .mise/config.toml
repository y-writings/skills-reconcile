# This TOML file contains project-specific settings.
# Add project-specific information here.

[tasks."container:build"]
description = "Build the CLI runtime image"
run = "docker build --target runtime --tag skills-reconcile:local ."

[tasks."container:test"]
description = "Build and smoke-test the CLI runtime image"
run = '''
set -eu

docker build --target runtime --tag skills-reconcile:local .

smoke_home="$(mktemp -d)"
external_tree="$(mktemp -d)"
external_skill="$external_tree/external-skill"
container_uid="$(id -u)"
container_gid="$(id -g)"
container_user="$container_uid:$container_gid"
supplementary_gid=''
group_probe_enabled=0
set -- --user "$container_user"
for group_id in $(id -G); do
  if test "$group_id" -ne "$container_gid"; then
    set -- "$@" --group-add "$group_id"
    if test -z "$supplementary_gid"; then
      supplementary_gid="$group_id"
    fi
  fi
done
cleanup() {
  chmod u+rwx "$smoke_home/group-agents" 2>/dev/null || true
  chmod -R u+rwx "$smoke_home/group-agents" 2>/dev/null || true
  chmod u+rwx "$smoke_home/unreadable-agents/skills/z-locked" \
    2>/dev/null || true
  chmod u+rwx "$smoke_home/external-tree/restricted" 2>/dev/null || true
  chmod -R u+w "$smoke_home" "$external_tree"
  rm -rf "$smoke_home" "$external_tree"
}
trap cleanup EXIT
mkdir -p \
  "$smoke_home/.agents/skills/alpha" \
  "$smoke_home/.agents/skills/zed" \
  "$smoke_home/group-agents/skills/group-skill" \
  "$smoke_home/ancestor-agents/skills" \
  "$smoke_home/external-tree/restricted/blocked-skill" \
  "$smoke_home/relative-root-agents" \
  "$smoke_home/relative-root-target/root-skill" \
  "$smoke_home/unreadable-agents/skills/a-valid" \
  "$smoke_home/unreadable-agents/skills/z-locked" \
  "$smoke_home/missing-agents" \
  "$external_skill"
touch "$smoke_home/.agents/skills/alpha/SKILL.md"
touch "$smoke_home/.agents/skills/zed/SKILL.md"
touch "$external_skill/SKILL.md"
touch "$smoke_home/group-agents/skills/group-skill/SKILL.md"
touch "$smoke_home/external-tree/restricted/blocked-skill/SKILL.md"
touch "$smoke_home/relative-root-target/root-skill/SKILL.md"
touch "$smoke_home/unreadable-agents/skills/a-valid/SKILL.md"
touch "$smoke_home/unreadable-agents/skills/z-locked/SKILL.md"
ln -s "$external_skill" "$smoke_home/.agents/skills/linked-skill"
ln -s \
  "$smoke_home/external-tree/restricted/blocked-skill" \
  "$smoke_home/ancestor-agents/skills/blocked-skill"
ln -s '../relative-root-target' "$smoke_home/relative-root-agents/skills"
chmod 000 "$smoke_home/unreadable-agents/skills/z-locked"
chmod 000 "$smoke_home/external-tree/restricted"
if test -n "$supplementary_gid" && test "$(uname -s)" = 'Linux'; then
  group_probe_enabled=1
  chgrp -R "$supplementary_gid" "$smoke_home/group-agents"
  chmod 040 "$smoke_home/group-agents/skills/group-skill/SKILL.md"
  chmod 050 "$smoke_home/group-agents/skills/group-skill"
  chmod 050 "$smoke_home/group-agents/skills"
  chmod 050 "$smoke_home/group-agents"
fi

expected="$(printf 'alpha\nlinked-skill\nzed\n')"
actual="$(docker run --rm --read-only \
  "$@" \
  --env HOME=/home/skills \
  --mount \
    "type=bind,src=$smoke_home/.agents,dst=/home/skills/.agents,readonly" \
  --mount \
    "type=bind,src=$external_tree,dst=$external_tree,readonly" \
  skills-reconcile:local list)"
if test "$actual" != "$expected"; then
  printf 'unexpected container CLI output: %s\n' "$actual" >&2
  exit 1
fi

relative_root_actual="$(docker run --rm --read-only \
  "$@" \
  --env HOME=/home/skills \
  --mount \
    "type=bind,src=$smoke_home/relative-root-agents,dst=/home/skills/.agents,readonly" \
  --mount \
    "type=bind,src=$smoke_home/relative-root-target,dst=/home/skills/relative-root-target,readonly" \
  skills-reconcile:local list)"
if test "$relative_root_actual" != 'root-skill'; then
  printf 'unexpected relative scan root output: %s\n' \
    "$relative_root_actual" >&2
  exit 1
fi

if test "$group_probe_enabled" -eq 1; then
  group_probe_uid=65534
  if test "$container_uid" -eq "$group_probe_uid"; then
    group_probe_uid=65533
  fi
  group_actual="$(
    shift 2
    docker run --rm --read-only \
      --user "$group_probe_uid:$container_gid" \
      "$@" \
      --env HOME=/home/skills \
      --mount \
        "type=bind,src=$smoke_home/group-agents,dst=/home/skills/.agents,readonly" \
      skills-reconcile:local list
  )"
  if test "$group_actual" != 'group-skill'; then
    printf 'unexpected supplementary group output: %s\n' \
      "$group_actual" >&2
    exit 1
  fi
fi

if test "$container_uid" -ne 0 && test "$(uname -s)" = 'Linux'; then
  set +e
  ancestor_stdout="$(docker run --rm --read-only \
    "$@" \
    --env HOME=/home/skills \
    --mount \
      "type=bind,src=$smoke_home/ancestor-agents,dst=/home/skills/.agents,readonly" \
    --mount \
      "type=bind,src=$smoke_home/external-tree,dst=$smoke_home/external-tree,readonly" \
    skills-reconcile:local list 2>"$smoke_home/ancestor-stderr")"
  ancestor_exit_code=$?
  set -e
  if test "$ancestor_exit_code" -ne 1 \
    || test -n "$ancestor_stdout" \
    || test ! -s "$smoke_home/ancestor-stderr"; then
    printf 'unexpected external ancestor result: status=%s stdout=%s\n' \
      "$ancestor_exit_code" "$ancestor_stdout" >&2
    exit 1
  fi
fi

set +e
missing_stdout="$(docker run --rm --read-only \
  "$@" \
  --env HOME=/home/skills \
  --mount \
    "type=bind,src=$smoke_home/missing-agents,dst=/home/skills/.agents,readonly" \
  skills-reconcile:local list 2>"$smoke_home/missing-stderr")"
missing_exit_code=$?
set -e
if test "$missing_exit_code" -ne 1 \
  || test -n "$missing_stdout" \
  || test ! -s "$smoke_home/missing-stderr"; then
  printf 'unexpected missing scan root result: status=%s stdout=%s\n' \
    "$missing_exit_code" "$missing_stdout" >&2
  exit 1
fi
if test "$container_uid" -ne 0; then
  set +e
  unreadable_stdout="$(docker run --rm --read-only \
    "$@" \
    --env HOME=/home/skills \
    --mount \
      "type=bind,src=$smoke_home/unreadable-agents,dst=/home/skills/.agents,readonly" \
    skills-reconcile:local list 2>"$smoke_home/unreadable-stderr")"
  unreadable_exit_code=$?
  set -e
  if test "$unreadable_exit_code" -ne 1 \
    || test -n "$unreadable_stdout" \
    || test ! -s "$smoke_home/unreadable-stderr"; then
    printf 'unexpected unreadable Skill result: status=%s stdout=%s\n' \
      "$unreadable_exit_code" "$unreadable_stdout" >&2
    exit 1
  fi
fi
'''
