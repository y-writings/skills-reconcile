name: "[01] Skills reconcile CI"
on:
  pull_request:
permissions:
  contents: read
jobs:
  build-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check format, tests, static analysis, and build
        run: |
          test "$(go env GOVERSION)" = "go1.24.0"
          unformatted="$(gofmt -l .)"
          test -z "$unformatted"
          go test ./...
          go vet ./...
          go build -trimpath -o "$RUNNER_TEMP/skills-reconcile" ./cmd/skills-reconcile
      - name: Smoke test the Go CLI
        run: |
          smoke_home="$RUNNER_TEMP/go-smoke-home"
          mkdir -p \
            "$smoke_home/.agents/skills/alpha" \
            "$smoke_home/.agents/skills/zed"
          touch \
            "$smoke_home/.agents/skills/alpha/SKILL.md" \
            "$smoke_home/.agents/skills/zed/SKILL.md"
          chmod -R a-w "$smoke_home"

          expected="$(printf 'alpha\nzed\n')"
          actual="$(HOME="$smoke_home" "$RUNNER_TEMP/skills-reconcile" list)"
          if test "$actual" != "$expected"; then
            printf 'unexpected Go CLI output: %s\n' "$actual" >&2
            exit 1
          fi
  nix-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Check flake outputs and package
        run: |
          nix flake check --all-systems
          nix build .#skills-reconcile
      - name: Smoke test the Nix package and apps
        run: |
          smoke_home="$RUNNER_TEMP/nix-smoke-home"
          mkdir -p \
            "$smoke_home/.agents/skills/alpha" \
            "$smoke_home/.agents/skills/zed"
          touch \
            "$smoke_home/.agents/skills/alpha/SKILL.md" \
            "$smoke_home/.agents/skills/zed/SKILL.md"
          chmod -R a-w "$smoke_home"

          expected="$(printf 'alpha\nzed\n')"
          export HOME="$smoke_home"
          export XDG_CACHE_HOME="$RUNNER_TEMP/nix-xdg/cache"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/nix-xdg/config"
          export XDG_STATE_HOME="$RUNNER_TEMP/nix-xdg/state"
          mkdir -p "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" "$XDG_STATE_HOME"

          assert_list_output() {
            label="$1"
            shift
            actual="$("$@" list)"
            if test "$actual" != "$expected"; then
              printf 'unexpected %s output: %s\n' "$label" "$actual" >&2
              exit 1
            fi
          }

          assert_list_output "Nix package" ./result/bin/skills-reconcile
          assert_list_output "named Nix app" nix run .#skills-reconcile --
          assert_list_output "default Nix app" nix run .#default --
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.6
          install: false
          cache: false
      - name: Test in the pinned container
        run: mise run --skip-tools container:test
